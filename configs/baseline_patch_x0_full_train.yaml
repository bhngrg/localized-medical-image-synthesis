# Full-training refit of the validated patch-conditioned x0 baseline.
#
# Uses all eligible BraTS 2020 training slices.
# No internal validation split or validation-loss checkpoint selection.

seed: 42

data:
  split_mode: full_train
  image_channel: 0
  min_tumor_pixels: 300
  use_whole_tumor: true
  batch_size: 8
  num_workers: 0
  pin_memory: false

model:
  in_channels: 4
  out_channels: 1
  base_channels: 32
  time_dim: 128
  cond_dim: 4

training:
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 0.01
  outside_loss_weight: 0.05

diffusion:
  timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02

inference:
  timestep_fraction: 0.75
  max_samples: 4
  max_base_candidates: 300
  max_mask_candidates: 500
  max_pairs: 4
  min_overlap: 0.80

inference_helpers:
  brain_threshold: 0.05
  mask_margin: 10